name: Publish

# Trusted Publishing: PyPI verifies this workflow's OIDC identity, so there is
# no API token to store or rotate. Configure it once at
# pypi.org/manage/account/publishing/ with the owner, the repository, this
# filename and the environment named below.
#
# Nothing is uploaded until verify.py passes on every supported Python and the
# tag matches the package version.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without uploading"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e . \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python verify.py --build

  build:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        name: Read the version from the package
        run: |
          version=$(python -c \
            "import re,pathlib;\
             print(re.search(r'__version__ = \"([^\"]+)\"', \
             pathlib.Path('decision_jef/__init__.py').read_text()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package version: $version"
      - name: Refuse a tag that disagrees with the version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          test "$tag" = "${{ steps.version.outputs.version }}" || {
            echo "::error::release tag $tag does not match package version \
${{ steps.version.outputs.version }}" >&2
            exit 1
          }
      - name: Refuse a version already on PyPI
        run: |
          v="${{ steps.version.outputs.version }}"
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/decision-jef/$v/json")
          if [ "$code" = "200" ]; then
            echo "::error::decision-jef $v is already published; bump the version" >&2
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # the only extra permission Trusted Publishing needs
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
