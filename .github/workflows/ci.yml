name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install with a CPU-only torch
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e . \
            --extra-index-url https://download.pytorch.org/whl/cpu
      # The same script that runs locally. A second copy of these checks
      # written into this file would drift from the one people actually run.
      - run: python verify.py --build
