name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Import and construct the public API
        run: |
          python - <<'PY'
          from decision_jef import Answer, Decider, Question, Request
          from decision_jef.model import temperature_bucket

          # A question validates its own shape, so these assertions are the
          # contract: 255 choice options, 2 to 10 score levels, noul keyed
          # false/true.
          q = Question("choice", "Which team?", {"a": "A", "b": "B"})
          assert q.keys == ["a", "b"]

          s = Question("score", "How urgent?", ["low", "mid", "high"])
          assert s.keys == ["0", "1", "2"]
          assert s.descriptions[2] == "high"

          n = Question("noul", "Urgent?", {"false": "no", "true": "yes"})
          assert n.keys == ["false", "true"]

          for bad in (
              lambda: Question("choice", "x", {str(i): str(i) for i in range(256)}),
              lambda: Question("score", "x", [str(i) for i in range(11)]),
              lambda: Question("score", "x", ["only one"]),
              lambda: Question("noul", "x", {"maybe": "no such key", "true": "y"}),
              lambda: Question("nope", "x", None),
          ):
              try:
                  bad()
              except ValueError:
                  continue
              raise AssertionError("expected ValueError")

          assert temperature_bucket("noul", 2) == "noul"
          assert temperature_bucket("score", 5) == "score:5"
          assert temperature_bucket("choice", 4) == "choice:4-6"
          assert temperature_bucket("choice", 20) == "choice:7+"

          r = Request("state", {"q": q})
          assert r.to_json()["questions"]["q"]["criteria"] == {"a": "A", "b": "B"}
          assert Request.from_json(r.to_json()).questions["q"].keys == ["a", "b"]

          a = Answer.from_json({"type": "noul", "noul": 0.95})
          assert abs(a.p("true") - 0.95) < 1e-9
          print("public API OK")
          PY
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
